<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loki</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E07B2A'/%3E%3Ccircle cx='11' cy='14' r='3' fill='%23fff'/%3E%3Ccircle cx='21' cy='14' r='3' fill='%23fff'/%3E%3Ccircle cx='11' cy='14' r='1.5' fill='%23222'/%3E%3Ccircle cx='21' cy='14' r='1.5' fill='%23222'/%3E%3Cellipse cx='16' cy='21' rx='4' ry='2.5' fill='%23c8602a'/%3E%3Cpath d='M8 8 Q5 4 3 7' stroke='%23c8602a' stroke-width='1.5' fill='none'/%3E%3Cpath d='M24 8 Q27 4 29 7' stroke='%23c8602a' stroke-width='1.5' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toolbar">
    <div id="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="14" fill="#E07B2A"/>
        <circle cx="11" cy="14" r="3" fill="#fff"/>
        <circle cx="21" cy="14" r="3" fill="#fff"/>
        <circle cx="11" cy="14" r="1.5" fill="#222"/>
        <circle cx="21" cy="14" r="1.5" fill="#222"/>
        <ellipse cx="16" cy="21" rx="4" ry="2.5" fill="#c8602a"/>
        <path d="M8 8 Q5 4 3 7" stroke="#c8602a" stroke-width="1.5" fill="none"/>
        <path d="M24 8 Q27 4 29 7" stroke="#c8602a" stroke-width="1.5" fill="none"/>
        <path d="M13 19 Q16 22 19 19" stroke="#c8602a" stroke-width="1.2" fill="none"/>
      </svg>
      <span id="brand-name">Loki</span>
    </div>
    <button id="open-btn" class="tb-btn">&#128194; Відкрити</button>
    <button id="live-btn" class="tb-btn secondary">&#8635; Live</button>
    <input id="search" placeholder="Пошук (текст або /regex/)..." autocomplete="off">
    <div id="level-filters">
      <button class="toggle-btn active" data-level="INFO">INFO</button>
      <button class="toggle-btn active" data-level="ERROR">ERROR</button>
      <button class="toggle-btn active" data-level="DEBUG">DEBUG</button>
      <button class="toggle-btn active" data-level="WARN">WARN</button>
    </div>
    <div id="comp-filters">
      <button class="toggle-btn active" data-comp="HTTP">HTTP</button>
      <button class="toggle-btn active" data-comp="SLAVE">SLAVE</button>
      <button class="toggle-btn active" data-comp="BUS">BUS</button>
      <button class="toggle-btn active" data-comp="OTHER">OTHER</button>
    </div>
    <span id="stats"></span>
  </div>

  <div id="trace-bar">
    &#128269; Trace: <span id="trace-val"></span>
    <button id="trace-clear">&#10005;</button>
  </div>

  <div id="drop-zone">
    <div>&#128228; Перетягніть лог-файл сюди</div>
    <div class="hint">або натисніть "Відкрити"</div>
  </div>

  <div id="workspace">
    <div id="list-pane">
      <div id="list-header">
        <span class="col-time sortable" data-sort="time">Час</span>
        <span class="col-level sortable" data-sort="level">Рівень</span>
        <span class="col-trace">Trace</span>
        <span class="col-comp sortable" data-sort="comp">Comp</span>
        <span class="col-dir">Dir</span>
        <span class="col-body">Повідомлення</span>
      </div>
      <div id="log-container">
        <div id="vs-spacer"></div>
      </div>
    </div>
    <div id="resize-handle"></div>
    <div id="detail-pane">
      <div id="detail-toolbar">
        <div id="detail-tabs">
          <button class="dtab active" data-tab="body">Body</button>
          <button class="dtab" data-tab="diff">Diff</button>
        </div>
        <input id="body-search" placeholder="Пошук в body...">
        <div id="detail-actions">
          <button id="expand-all-btn" class="daction-btn" title="Розгорнути все">&#8862;</button>
          <button id="collapse-all-btn" class="daction-btn" title="Згорнути все">&#8863;</button>
          <button id="pin-btn" class="daction-btn" title="Запинити для порівняння">&#128204; Pin</button>
        </div>
      </div>
      <div id="detail-meta"></div>
      <div id="detail-content"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
